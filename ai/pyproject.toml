[project]
name = "spa-ai"
version = "0.1.0"
description = "AI layer for Smart Project Allocation: rule scoring, Groq client, resume extraction. Pure library: no DB, no web framework."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pypdf>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spa_ai"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
